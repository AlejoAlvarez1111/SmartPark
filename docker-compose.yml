# Uso: docker compose up --build   ->  http://localhost:3000
# Los valores se toman de .env si existe; si no, de los valores por defecto de abajo.
name: smartpark

x-app-env: &app-env
  NODE_ENV: production
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER:-smartpark_user}
  DB_PASSWORD: ${DB_PASSWORD:-change_me}
  VEHICLES_DB: ${VEHICLES_DB:-smartpark_vehicles}
  SPACES_DB: ${SPACES_DB:-smartpark_spaces}
  RESERVATIONS_DB: ${RESERVATIONS_DB:-smartpark_reservations}
  SENSORS_DB: ${SENSORS_DB:-smartpark_sensors}
  VEHICLES_SERVICE_URL: http://vehicles:3001
  SPACES_SERVICE_URL: http://spaces:3002
  RESERVATIONS_SERVICE_URL: http://reservations:3003
  SENSORS_SERVICE_URL: http://sensors:3004
  SERVICE_TIMEOUT_MS: ${SERVICE_TIMEOUT_MS:-3000}
  RESERVATION_HOLD_MINUTES: ${RESERVATION_HOLD_MINUTES:-60}
  RESERVATION_PAST_TOLERANCE_MINUTES: ${RESERVATION_PAST_TOLERANCE_MINUTES:-5}
  OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5500}

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 3

x-service: &service
  restart: unless-stopped
  depends_on:
    db-setup:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
      TZ: UTC
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Tarea única: crea bases, usuario, tablas y datos de demostración; luego termina
  db-setup:
    build: { context: ., args: { APP: database } }
    command: ["node", "setup.js"]
    environment:
      <<: *app-env
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    depends_on:
      mysql:
        condition: service_healthy

  vehicles:
    <<: *service
    build: { context: ., args: { APP: services/vehicles-service } }
    environment: { <<: *app-env, VEHICLES_PORT: 3001 }
    ports: ["3001:3001"]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }

  spaces:
    <<: *service
    build: { context: ., args: { APP: services/spaces-service } }
    environment: { <<: *app-env, SPACES_PORT: 3002 }
    ports: ["3002:3002"]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }

  reservations:
    <<: *service
    build: { context: ., args: { APP: services/reservations-service } }
    environment: { <<: *app-env, RESERVATIONS_PORT: 3003 }
    ports: ["3003:3003"]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }

  sensors:
    <<: *service
    build: { context: ., args: { APP: services/sensors-service } }
    environment: { <<: *app-env, SENSORS_PORT: 3004 }
    ports: ["3004:3004"]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }

  # El gateway no espera a que los servicios estén sanos: si uno cae, responde 503 controlado (CA-11)
  gateway:
    restart: unless-stopped
    build: { context: ., args: { APP: gateway } }
    environment: { <<: *app-env, GATEWAY_PORT: 3000 }
    ports: ["3000:3000"]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }
    depends_on: [vehicles, spaces, reservations, sensors]

volumes:
  mysql-data:
